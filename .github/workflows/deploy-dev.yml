name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [dev]

env:
  AWS_ROLE_ARN: arn:aws:iam::390402573611:role/trigo-github-actions-role
  AWS_REGION: sa-east-1
  S3_BUCKET: portal-parceiros-frontend-dev
  CLOUDFRONT_DISTRIBUTION_ID: EZJM0VN7NTYNF
  VITE_API_URL: https://portal-parceiros-api-dev.trigodourado.com
  VITE_BACKOFFICE_URL: https://dev.trigodourado.com

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Sync build to S3 root
        run: |
          aws s3 sync ./dist s3://${{ env.S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
